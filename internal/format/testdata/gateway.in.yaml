apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: app
spec:
  listeners:
    - tls:
        certificateRefs:
          - name: app-tls
            kind: Secret
      protocol: HTTPS
      port: 8443
      hostname: app.example.com
      name: https
  parentRef:
    namespace: gateway
    name: external
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  rules:
    - backendRefs:
        - port: 80
          name: app
      filters:
        - extensionRef:
            name: auth
            kind: Middleware
            group: traefik.io
          type: ExtensionRef
      matches:
        - path:
            value: /
            type: PathPrefix
  parentRefs:
    - sectionName: https
      name: app
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - app.example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app
spec:
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: prod
  privateKey:
    rotationPolicy: Always
    size: 256
    algorithm: ECDSA
  dnsNames:
    - app.example.com
  secretName: app-tls
