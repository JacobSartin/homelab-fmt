apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: app-template
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cluster
spec:
  interval: 10m
  url: ssh://git@github.com/example/cluster
  ref:
    branch: main
  secretRef:
    name: deploy-key
  ignore: |
    /*
    !/apps
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: example
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/example/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    createNamespace: true
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      strategy: rollback
      retries: 3
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
spec:
  interval: 10m
  path: ./apps/app
  sourceRef:
    kind: GitRepository
    name: cluster
  commonMetadata:
    labels:
      app.kubernetes.io/name: app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-settings
  patches:
    - patch: |-
        - op: add
          path: /spec/suspend
          value: true
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: app-
resources:
  - helm-release.yaml
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels/example
        value: "true"
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: Middleware
          name: app
        fieldPaths:
          - metadata.namespace
configMapGenerator:
  - name: app-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app
spec:
  refreshInterval: 1h
  target:
    name: app
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      remoteRef:
        key: app
        property: token
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: app-password
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: app
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  grafanaCom:
    id: 1234
    revision: 1
  folder: Apps
