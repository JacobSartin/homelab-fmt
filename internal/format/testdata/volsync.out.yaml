apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app
spec:
  accessModes: [ReadWriteOnce]
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: app-dst
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: app
spec:
  sourcePVC: app
  trigger:
    schedule: 0 * * * *
  paused: false
  restic:
    repository: app-volsync
    copyMethod: Snapshot
    pruneIntervalDays: 7
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 3
      yearly: 1
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
    moverSecurityContext:
      fsGroup: 568
      runAsGroup: 568
      runAsUser: 568
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: app-dst
spec:
  trigger:
    manual: restore-once
  restic:
    repository: app-volsync
    copyMethod: Snapshot
    capacity: 5Gi
    cleanupTempPVC: false
    cleanupCachePVC: false
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
