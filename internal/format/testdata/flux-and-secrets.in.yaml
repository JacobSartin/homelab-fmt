apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: app-template
spec:
  ref:
    tag: 5.3.0
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  layerSelector:
    operation: copy
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
  interval: 1h
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cluster
spec:
  ignore: |
    /*
    !/apps
  secretRef:
    name: deploy-key
  ref:
    branch: main
  url: ssh://git@github.com/example/cluster
  interval: 10m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: example
spec:
  url: oci://ghcr.io/example/charts
  interval: 1h
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app
spec:
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    disableWait: true
    cleanupOnFail: true
  install:
    remediation:
      retries: 3
    disableWait: true
    createNamespace: true
  chartRef:
    name: app-template
    kind: OCIRepository
  interval: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
spec:
  patches:
    - target:
        kind: HelmRelease
        group: helm.toolkit.fluxcd.io
      patch: |-
        - op: add
          path: /spec/suspend
          value: true
  postBuild:
    substituteFrom:
      - name: cluster-settings
        kind: Secret
  commonMetadata:
    labels:
      app.kubernetes.io/name: app
  sourceRef:
    name: cluster
    kind: GitRepository
  path: ./apps/app
  interval: 10m
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
      disableNameSuffixHash: true
    files:
      - values.yaml
    name: app-values
replacements:
  - targets:
      - fieldPaths:
          - metadata.namespace
        select:
          name: app
          kind: Middleware
    source:
      fieldPath: metadata.name
      kind: Namespace
patches:
  - patch: |-
      - op: add
        path: /metadata/labels/example
        value: "true"
    target:
      kind: Namespace
resources:
  - helm-release.yaml
namePrefix: app-
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          name: app-password
          kind: Password
          apiVersion: generators.external-secrets.io/v1alpha1
  data:
    - remoteRef:
        property: token
        key: app
      sourceRef:
        storeRef:
          name: cluster
          kind: ClusterSecretStore
      secretKey: token
  target:
    template:
      data:
        TOKEN: "{{ .token }}"
      type: Opaque
      engineVersion: v2
    creationPolicy: Owner
    name: app
  refreshInterval: 1h
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: app
spec:
  folder: Apps
  grafanaCom:
    revision: 1
    id: 1234
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
