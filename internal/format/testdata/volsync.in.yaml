apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app
spec:
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
  dataSourceRef:
    kind: ReplicationDestination
    name: app-dst
    apiGroup: volsync.backube
  accessModes: [ReadWriteOnce]
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: app
spec:
  paused: false
  restic:
    accessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
    pruneIntervalDays: 7
    repository: app-volsync
    retain:
      daily: 5
      hourly: 6
      monthly: 3
      weekly: 4
      yearly: 1
    storageClassName: longhorn
  sourcePVC: app
  trigger:
    schedule: 0 * * * *
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: app-dst
spec:
  restic:
    accessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    capacity: 5Gi
    cleanupCachePVC: false
    cleanupTempPVC: false
    copyMethod: Snapshot
    repository: app-volsync
    storageClassName: longhorn
  trigger:
    manual: restore-once
