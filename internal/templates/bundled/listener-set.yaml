# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/listenerset_v1.json
# homelab-fmt: extends kubernetes.yaml
# Values are placeholders.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: example
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: example
    namespace: example
  listeners:
    - name: https
      hostname: app.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: example
            namespace: example
        options: {}
      allowedRoutes:
        namespaces:
          from: Same
          selector: {}
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
