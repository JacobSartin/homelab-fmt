# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# homelab-fmt: extends kubernetes.yaml
# Values are placeholders. A dataFrom entry has one of sourceRef, extract and
# find; a sourceRef has storeRef or generatorRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example
  target:
    name: example
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: false
    manifest:
      apiVersion: v1
      kind: ConfigMap
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels: {}
        annotations: {}
        finalizers: []
      data: {}
      templateFrom: []
  data:
    - secretKey: example
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: example
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: example
      remoteRef:
        key: example
        property: example
        version: "1"
        decodingStrategy: None
        conversionStrategy: Default
        metadataPolicy: None
        nullBytePolicy: Ignore
  dataFrom:
    - sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: example
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: example
      extract:
        key: example
        property: example
        version: "1"
        decodingStrategy: None
        conversionStrategy: Default
        metadataPolicy: None
        nullBytePolicy: Ignore
      find:
        path: example
        name:
          regexp: example
        tags: {}
        decodingStrategy: None
        conversionStrategy: Default
        nullBytePolicy: Ignore
      rewrite: []
